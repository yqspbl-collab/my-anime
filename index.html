<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的收藏</title>
<style>
  :root{
    --bg:#f7f8fa;
    --panel:#ffffff;
    --text:#1f2328;
    --muted:#8a919c;
    --line:#e8eaee;
    --accent:#ec6a80;
    --accent-soft:#fdeef1;
    --radius:10px;
  }

  *{ box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 顶栏 ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:16px;
    padding:14px 24px;
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }

  .brand{
    font-size:17px; font-weight:700; letter-spacing:.5px;
    white-space:nowrap;
  }
  .brand .mark{ color:var(--accent); }

  .search{ flex:1; max-width:380px; }
  .search input{
    width:100%;
    padding:9px 14px;
    border:1px solid var(--line);
    border-radius:999px;
    font-size:13.5px;
    font-family:inherit;
    background:#fff;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .search input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }

  .btn{
    border:1px solid var(--line);
    background:#fff;
    color:var(--text);
    padding:9px 16px;
    border-radius:8px;
    font-size:13.5px;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s;
  }
  .btn:hover{ border-color:#d3d7dd; }
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .btn.primary:hover{ filter:brightness(.95); }

  /* ---------- 工具栏 ---------- */
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    justify-content:space-between;
    padding:18px 24px 0;
  }

  .filters{ display:flex; flex-wrap:wrap; gap:6px; }

  .chip{
    padding:6px 13px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--muted);
    font-size:12.5px;
    font-family:inherit;
    cursor:pointer;
    transition:all .15s;
  }
  .chip:hover{ border-color:#d3d7dd; color:var(--text); }
  .chip.active{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
    font-weight:600;
  }

  .sort{
    padding:7px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    font-size:12.5px;
    font-family:inherit;
    color:var(--muted);
    outline:none;
    cursor:pointer;
  }
  .sort:focus{ border-color:var(--accent); }

  /* ---------- 网格 ---------- */
  main{
    padding:20px 24px 40px;
    max-width:1400px;
    margin:0 auto;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(124px, 1fr));
    gap:20px 16px;
  }

  .card{ cursor:pointer; }

  .cover{
    position:relative;
    aspect-ratio:2/3;
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eef0f3;
    transition:box-shadow .18s ease;
  }
  .card:hover .cover{
    box-shadow:0 8px 22px rgba(20,22,26,.16);
  }
  .card:hover{ transform:translateY(-2px); }
  .card{ transition:transform .18s ease; }

  .cover img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  .cover .ph{
    font-size:30px;
    font-weight:600;
    opacity:.75;
    user-select:none;
  }

  .status-dot{
    position:absolute;
    top:8px; right:8px;
    width:9px; height:9px;
    border-radius:50%;
    box-shadow:0 0 0 2px rgba(255,255,255,.9);
  }

  .card-body{ padding:8px 2px 0; }

  .title{
    font-size:13.5px;
    font-weight:500;
    line-height:1.4;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .sub{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:3px;
    font-size:12px;
    color:var(--muted);
  }
  .sub .rating{ color:var(--accent); font-weight:600; }

  /* ---------- 空状态 ---------- */
  .empty{
    display:none;
    text-align:center;
    padding:90px 20px;
    color:var(--muted);
  }
  .empty p{ margin:0 0 8px; }
  .empty .dim{ font-size:13px; color:#b3b8c0; }

  /* ---------- 统计 ---------- */
  .stats{
    max-width:1400px;
    margin:0 auto;
    padding:0 24px 40px;
    font-size:12.5px;
    color:var(--muted);
  }

  /* ---------- 弹窗 ---------- */
  .overlay{
    position:fixed; inset:0;
    z-index:50;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(20,22,26,.42);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
  }
  .overlay.open{ display:flex; }

  .modal{
    width:100%;
    max-width:520px;
    max-height:90vh;
    overflow-y:auto;
    background:var(--panel);
    border-radius:14px;
    padding:26px;
    box-shadow:0 24px 70px rgba(0,0,0,.22);
  }

  .modal h2{
    margin:0 0 18px;
    font-size:16px;
    font-weight:700;
  }

  form{ display:flex; flex-direction:column; gap:14px; }

  label{
    display:flex;
    flex-direction:column;
    gap:6px;
    font-size:12.5px;
    color:var(--muted);
  }

  label input, label select, label textarea{
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:13.5px;
    font-family:inherit;
    color:var(--text);
    background:#fff;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
    resize:vertical;
  }
  label input:focus, label select:focus, label textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }

  .row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .rating-input{ display:flex; gap:4px; flex-wrap:wrap; }

  .rbtn{
    width:31px; height:31px;
    padding:0;
    border:1px solid var(--line);
    border-radius:7px;
    background:#fff;
    color:var(--muted);
    font-size:12.5px;
    font-family:inherit;
    cursor:pointer;
    transition:all .12s;
  }
  .rbtn:hover{ border-color:#d3d7dd; }
  .rbtn.on{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }

  .actions{
    display:flex;
    gap:10px;
    justify-content:flex-end;
    margin-top:6px;
  }
  .actions .del{
    margin-right:auto;
    color:#d16a6a;
  }
  .actions .del:hover{ border-color:#d16a6a; background:#fdf3f3; }

  @media (max-width:640px){
    .topbar{ flex-wrap:wrap; padding:12px 16px; gap:10px; }
    .search{ order:3; flex:1 1 100%; max-width:none; }
    .toolbar{ padding:14px 16px 0; }
    main{ padding:16px 16px 30px; }
    .stats{ padding:0 16px 30px; }
    .grid{ grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:16px 12px; }
    .row{ grid-template-columns:1fr; }
    .modal{ padding:20px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="mark">◈</span> 我的收藏</div>
  <div class="search">
    <input id="search" type="search" placeholder="搜索标题、标签、简介…" autocomplete="off">
  </div>
  <button class="btn primary" id="addBtn">＋ 添加</button>
</header>

<div class="toolbar">
  <div class="filters">
    <div class="filters" id="typeFilter" style="gap:6px"></div>
    <div style="width:1px;background:var(--line);margin:0 4px;"></div>
    <div class="filters" id="statusFilter" style="gap:6px"></div>
  </div>
  <select class="sort" id="sortSel">
    <option value="added">最近添加</option>
    <option value="rating">评分最高</option>
    <option value="title">标题排序</option>
  </select>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty"></div>
</main>

<div class="stats" id="stats"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="formTitle">添加条目</h2>
    <form id="form">
      <label>标题
        <input name="title" maxlength="80" required placeholder="例如：星际牛仔">
      </label>

      <label>原名 / 别名
        <input name="original" maxlength="80" placeholder="可选">
      </label>

      <div class="row">
        <label>类型
          <select name="type"></select>
        </label>
        <label>状态
          <select name="status"></select>
        </label>
      </div>

      <label>评分（点击数字，再点一次取消）
        <div class="rating-input" id="ratingInput"></div>
      </label>

      <div class="row">
        <label>当前进度
          <input name="progress" type="number" min="0" placeholder="0">
        </label>
        <label>总进度
          <input name="total" type="number" min="0" placeholder="—">
        </label>
      </div>

      <label>标签（用逗号分隔）
        <input name="tags" maxlength="100" placeholder="科幻, 治愈, 神作">
      </label>

      <label>封面图片链接
        <input name="cover" placeholder="https://…">
      </label>

      <label>简介
        <textarea name="summary" rows="3" maxlength="500" placeholder="随便写点什么…"></textarea>
      </label>

      <div class="actions">
        <button type="button" class="btn del" id="delBtn">删除</button>
        <button type="button" class="btn" id="cancelBtn">取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ========== 常量 ========== */
  const KEY = 'my-collection-v1';
  const TYPES = ['动画','漫画','游戏','小说','音乐','三次元'];
  const STATUSES = ['想看','在看','看过','搁置','抛弃'];
  const STATUS_COLOR = {
    '想看':'#5b9bd5', '在看':'#4caf7d', '看过':'#9aa3af',
    '搁置':'#e0a04a', '抛弃':'#d16a6a'
  };

  /* ========== 状态 ========== */
  let items = [];
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(raw)) items = raw;
  } catch(e){ items = []; }

  let editingId = null;
  let currentRating = 0;
  let filterType = '全部';
  let filterStatus = '全部';
  let keyword = '';
  let sortBy = 'added';

  /* ========== DOM ========== */
  const grid        = document.getElementById('grid');
  const empty       = document.getElementById('empty');
  const stats       = document.getElementById('stats');
  const overlay     = document.getElementById('overlay');
  const form        = document.getElementById('form');
  const formTitle   = document.getElementById('formTitle');
  const ratingInput = document.getElementById('ratingInput');
  const delBtn      = document.getElementById('delBtn');
  const typeFilter  = document.getElementById('typeFilter');
  const statusFilter= document.getElementById('statusFilter');
  const searchInput = document.getElementById('search');
  const sortSel     = document.getElementById('sortSel');

  /* ========== 工具 ========== */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));

  function hueOf(str){
    let h = 0;
    for (const ch of String(str)) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return h;
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function save(){
    try {
      localStorage.setItem(KEY, JSON.stringify(items));
    } catch(e){
      alert('保存失败：浏览器存储空间可能已满。');
    }
  }

  const field = n => form.querySelector('[name="' + n + '"]');

  /* ========== 初始化 ========== */
  function init(){
    field('type').innerHTML   = TYPES.map(t => '<option>' + t + '</option>').join('');
    field('status').innerHTML = STATUSES.map(s => '<option>' + s + '</option>').join('');

    let rh = '';
    for (let i = 1; i <= 10; i++){
      rh += '<button type="button" class="rbtn" data-v="' + i + '">' + i + '</button>';
    }
    ratingInput.innerHTML = rh;

    buildChips();
    bindEvents();
    render();
  }

  function buildChips(){
    typeFilter.innerHTML = ['全部'].concat(TYPES).map(t =>
      '<button class="chip' + (filterType === t ? ' active' : '') + '" data-type="' + t + '">' + t + '</button>'
    ).join('');

    statusFilter.innerHTML = ['全部'].concat(STATUSES).map(s =>
      '<button class="chip' + (filterStatus === s ? ' active' : '') + '" data-status="' + s + '">' + s + '</button>'
    ).join('');
  }

  /* ========== 渲染 ========== */
  function currentList(){
    const kw = keyword.trim().toLowerCase();

    const list = items.filter(it => {
      if (filterType !== '全部' && it.type !== filterType) return false;
      if (filterStatus !== '全部' && it.status !== filterStatus) return false;
      if (kw){
        const hay = [it.title, it.original, it.tags, it.summary]
          .filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(kw)) return false;
      }
      return true;
    });

    list.sort((a, b) => {
      if (sortBy === 'rating') return (b.rating || 0) - (a.rating || 0) || (b.added || 0) - (a.added || 0);
      if (sortBy === 'title')  return String(a.title).localeCompare(String(b.title), 'zh');
      return (b.added || 0) - (a.added || 0);
    });

    return list;
  }

  function cardHTML(it){
    const h = hueOf(it.title);
    const ph = esc(String(it.title).slice(0, 1));

    const img = it.cover
      ? '<img src="' + esc(it.cover) + '" alt="" loading="lazy" onerror="this.remove()">'
      : '';

    const rating = it.rating > 0
      ? '<span class="rating">★ ' + it.rating + '</span>'
      : '<span>—</span>';

    return '<article class="card" data-id="' + it.id + '">' +
      '<div class="cover" style="background:hsl(' + h + ',46%,93%);color:hsl(' + h + ',34%,48%)">' +
        '<span class="ph">' + ph + '</span>' +
        img +
        '<span class="status-dot" style="background:' +
          (STATUS_COLOR[it.status] || '#ccc') + '" title="' + esc(it.status) + '"></span>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="title" title="' + esc(it.title) + '">' + esc(it.title) + '</div>' +
        '<div class="sub">' + rating + '<span>·</span><span>' + esc(it.type) + '</span></div>' +
      '</div>' +
    '</article>';
  }

  function render(){
    const list = currentList();

    if (!items.length){
      grid.innerHTML = '';
      empty.innerHTML = '<p>还没有任何条目</p>' +
        '<p class="dim">点击右上角「＋ 添加」开始记录你的收藏</p>';
      empty.style.display = 'block';
    } else if (!list.length){
      grid.innerHTML = '';
      empty.innerHTML = '<p>没有匹配的条目</p>' +
        '<p class="dim">试试换个筛选条件或清空搜索</p>';
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      grid.innerHTML = list.map(cardHTML).join('');
    }

    renderStats();
  }

  function renderStats(){
    if (!items.length){ stats.textContent = ''; return; }

    const rated = items.filter(i => i.rating > 0);
    const avg = rated.length
      ? (rated.reduce((s, i) => s + i.rating, 0) / rated.length).toFixed(1)
      : '—';

    const counts = STATUSES
      .map(s => {
        const n = items.filter(i => i.status === s).length;
        return n ? s + ' ' + n : null;
      })
      .filter(Boolean)
      .join(' · ');

    stats.textContent = '共 ' + items.length + ' 条 · ' + counts + ' · 平均分 ' + avg;
  }

  /* ========== 表单 ========== */
  function paintRating(){
    ratingInput.querySelectorAll('.rbtn').forEach(b => {
      b.classList.toggle('on', Number(b.dataset.v) <= currentRating);
    });
  }

  function openForm(item){
    editingId = item ? item.id : null;
    formTitle.textContent = item ? '编辑条目' : '添加条目';
    form.reset();

    field('title').value    = item ? item.title    || '' : '';
    field('original').value = item ? item.original || '' : '';
    field('type').value     = item ? item.type     || TYPES[0] : TYPES[0];
    field('status').value   = item ? item.status   || STATUSES[0] : STATUSES[0];
    field('progress').value = item && item.progress ? item.progress : '';
    field('total').value    = item && item.total    ? item.total    : '';
    field('tags').value     = item ? item.tags     || '' : '';
    field('cover').value    = item ? item.cover    || '' : '';
    field('summary').value  = item ? item.summary  || '' : '';

    currentRating = item ? item.rating || 0 : 0;
    paintRating();

    delBtn.style.display = item ? 'block' : 'none';

    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(() => field('title').focus(), 60);
  }

  function closeForm(){
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    editingId = null;
  }

  /* ========== 事件 ========== */
  function bindEvents(){
    document.getElementById('addBtn').addEventListener('click', () => openForm(null));
    document.getElementById('cancelBtn').addEventListener('click', closeForm);

    overlay.addEventListener('click', e => {
      if (e.target === overlay) closeForm();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && overlay.classList.contains('open')) closeForm();
    });

    ratingInput.addEventListener('click', e => {
      const btn = e.target.closest('.rbtn');
      if (!btn) return;
      const v = Number(btn.dataset.v);
      currentRating = (currentRating === v) ? 0 : v;
      paintRating();
    });

    form.addEventListener('submit', e => {
      e.preventDefault();

      const title = field('title').value.trim();
      if (!title) return;

      const data = {
        title:    title,
        original: field('original').value.trim(),
        type:     field('type').value,
        status:   field('status').value,
        rating:   currentRating,
        progress: Number(field('progress').value) || 0,
        total:    Number(field('total').value) || 0,
        tags:     field('tags').value.trim(),
        cover:    field('cover').value.trim(),
        summary:  field('summary').value.trim()
      };

      if (editingId){
        const i = items.findIndex(x => x.id === editingId);
        if (i > -1) items[i] = Object.assign({}, items[i], data);
      } else {
        items.unshift(Object.assign({ id: uid(), added: Date.now() }, data));
      }

      save();
      closeForm();
      render();
    });

    delBtn.addEventListener('click', () => {
      if (!editingId) return;
      const item = items.find(x => x.id === editingId);
      if (!item) return;
      if (confirm('确定要删除「' + item.title + '」吗？')){
        items = items.filter(x => x.id !== editingId);
        save();
        closeForm();
        render();
      }
    });

    typeFilter.addEventListener('click', e => {
      const c = e.target.closest('.chip');
      if (!c) return;
      filterType = c.dataset.type;
      buildChips();
      render();
    });

    statusFilter.addEventListener('click', e => {
      const c = e.target.closest('.chip');
      if (!c) return;
      filterStatus = c.dataset.status;
      buildChips();
      render();
    });

    searchInput.addEventListener('input', e => {
      keyword = e.target.value;
      render();
    });

    sortSel.addEventListener('change', e => {
      sortBy = e.target.value;
      render();
    });

    grid.addEventListener('click', e => {
      const card = e.target.closest('.card');
      if (!card) return;
      const item = items.find(x => x.id === card.dataset.id);
      if (item) openForm(item);
    });
  }

  init();
})();
</script>
</body>
</html>
