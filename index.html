<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初音绿 · 番剧管理</title>
<style>
  :root {
    --miku: #39C5BB;
    --miku-dark: #2aa89f;
    --miku-soft: rgba(57, 197, 187, 0.12);
    --bg: #f5fbfa;
    --card: #ffffff;
    --text: #1e2a28;
    --muted: #6b7c78;
    --border: #d9ece9;
    --danger: #e05c6e;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  header {
    background: var(--miku);
    color: #fff;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  header h1 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  header h1 span {
    opacity: 0.85;
    font-weight: 400;
    font-size: 0.9rem;
    margin-left: 8px;
  }

  .btn {
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-primary { background: #fff; color: var(--miku-dark); }
  .btn-primary:hover { opacity: 0.9; }

  .btn-ghost {
    background: transparent;
    color: var(--miku-dark);
    border: 1.5px solid var(--miku);
  }
  .btn-ghost:hover { background: var(--miku-soft); }

  .btn-danger { background: transparent; color: var(--danger); border: 1px solid #f0c0c6; }
  .btn-danger:hover { background: #fdf0f1; }

  .btn-sm { padding: 5px 12px; font-size: 0.82rem; }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  .toolbar input {
    flex: 1;
    min-width: 200px;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 0.92rem;
    background: var(--card);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .toolbar input:focus { border-color: var(--miku); }
  .toolbar input::placeholder { color: #a8bbb7; }

  .count {
    font-size: 0.85rem;
    color: var(--muted);
    white-space: nowrap;
  }

  /* 网格 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: box-shadow 0.18s, border-color 0.18s;
    border-left: 4px solid var(--miku);
  }

  .card:hover {
    box-shadow: 0 4px 18px rgba(57, 197, 187, 0.15);
    border-color: var(--miku);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .card-title {
    font-size: 1.02rem;
    font-weight: 700;
    line-height: 1.4;
    word-break: break-word;
  }

  .card-title .year {
    font-weight: 400;
    color: var(--muted);
    font-size: 0.85rem;
    margin-left: 6px;
  }

  .status-badge {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .status-在看 { background: var(--miku-soft); color: var(--miku-dark); }
  .status-想看 { background: #f0f4f8; color: #5a6b80; }
  .status-看过 { background: #eef6ee; color: #4a7c4a; }
  .status-搁置 { background: #fdf6e8; color: #9a7b3c; }

  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .card-meta span {
    background: #f6faf9;
    padding: 1px 8px;
    border-radius: 5px;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: auto;
    padding-top: 6px;
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  .empty strong { color: var(--miku-dark); }

  /* 模态框 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 35, 32, 0.45);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--card);
    border-radius: 16px;
    width: 100%;
    max-width: 460px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    border-top: 5px solid var(--miku);
  }

  .modal h2 {
    font-size: 1.1rem;
    margin-bottom: 18px;
    color: var(--miku-dark);
  }

  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 5px;
    color: var(--muted);
  }

  .field input,
  .field select,
  .field textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    font-family: inherit;
    background: #fbfefd;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .field input:focus,
  .field select:focus,
  .field textarea:focus { border-color: var(--miku); }

  .field textarea { resize: vertical; min-height: 72px; }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 520px) {
    header { padding: 16px; }
    main { padding: 18px 14px 50px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { padding: 14px; }
    .card-title { font-size: 0.92rem; }
    .card-actions { flex-direction: column; }
    .field-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>🎵 番剧管理 <span>Miku Green Edition</span></h1>
  <button class="btn btn-primary" id="addBtn">+ 添加番剧</button>
</header>

<main>
  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="搜索标题、标签或备注…">
    <span class="count" id="countLabel"></span>
  </div>

  <div class="grid" id="grid"></div>
</main>

<!-- 编辑 / 添加 模态框 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">添加番剧</h2>
    <form id="animeForm">
      <input type="hidden" id="editId">

      <div class="field">
        <label for="title">标题 *</label>
        <input type="text" id="title" required placeholder="例如：葬送的芙莉莲">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="year">年份</label>
          <input type="number" id="year" placeholder="2024" min="1950" max="2100">
        </div>
        <div class="field">
          <label for="episodes">集数</label>
          <input type="number" id="episodes" placeholder="28" min="1" max="9999">
        </div>
      </div>

      <div class="field">
        <label for="status">状态</label>
        <select id="status">
          <option value="在看">在看</option>
          <option value="想看">想看</option>
          <option value="看过">看过</option>
          <option value="搁置">搁置</option>
        </select>
      </div>

      <div class="field">
        <label for="tags">标签（用逗号分隔）</label>
        <input type="text" id="tags" placeholder="奇幻, 冒险, 治愈">
      </div>

      <div class="field">
        <label for="note">备注</label>
        <textarea id="note" placeholder="个人向短评或记录…"></textarea>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" id="cancelBtn">取消</button>
        <button type="submit" class="btn btn-primary" style="background:var(--miku);color:#fff;">保存</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "miku_bangumi_list_v1";

  // ---------- 数据层 ----------
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  function save(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  let animeList = load();

  // ---------- DOM ----------
  const grid = document.getElementById("grid");
  const countLabel = document.getElementById("countLabel");
  const searchInput = document.getElementById("searchInput");
  const modalOverlay = document.getElementById("modalOverlay");
  const modalTitle = document.getElementById("modalTitle");
  const form = document.getElementById("animeForm");
  const editId = document.getElementById("editId");
  const titleInput = document.getElementById("title");
  const yearInput = document.getElementById("year");
  const episodesInput = document.getElementById("episodes");
  const statusSelect = document.getElementById("status");
  const tagsInput = document.getElementById("tags");
  const noteInput = document.getElementById("note");

  // ---------- 渲染 ----------
  let keyword = "";

  function filtered() {
    if (!keyword.trim()) return animeList;
    const k = keyword.trim().toLowerCase();
    return animeList.filter(a =>
      (a.title || "").toLowerCase().includes(k) ||
      (a.tags || []).some(t => t.toLowerCase().includes(k)) ||
      (a.note || "").toLowerCase().includes(k)
    );
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function render() {
    const list = filtered();
    countLabel.textContent = `共 ${animeList.length} 部${keyword ? `，筛选出 ${list.length} 部` : ""}`;

    if (!list.length) {
      grid.innerHTML = `<div class="empty">
        <p>${animeList.length ? "没有匹配的番剧" : "还没有番剧记录"}</p>
        <p style="margin-top:8px;font-size:0.9rem;">${
          animeList.length ? "试试换个关键词" : "点击右上角 <strong>+ 添加番剧</strong> 开始记录"
        }</p>
      </div>`;
      return;
    }

    grid.innerHTML = list.map(a => `
      <div class="card" data-id="${a.id}">
        <div class="card-top">
          <div class="card-title">
            ${escapeHtml(a.title)}
            ${a.year ? `<span class="year">${escapeHtml(a.year)}</span>` : ""}
          </div>
          <span class="status-badge status-${escapeHtml(a.status)}">${escapeHtml(a.status)}</span>
        </div>
        <div class="card-meta">
          ${a.episodes ? `<span>全 ${a.episodes} 集</span>` : ""}
          ${(a.tags || []).slice(0, 3).map(t => `<span>${escapeHtml(t)}</span>`).join("")}
        </div>
        ${a.note ? `<div style="font-size:0.82rem;color:var(--muted);line-height:1.5;">${escapeHtml(a.note)}</div>` : ""}
        <div class="card-actions">
          <button class="btn btn-ghost btn-sm edit-btn" data-id="${a.id}">编辑</button>
          <button class="btn btn-danger btn-sm delete-btn" data-id="${a.id}">删除</button>
        </div>
      </div>
    `).join("");
  }

  // ---------- 模态框 ----------
  function openModal(mode, id) {
    form.reset();
    editId.value = "";
    if (mode === "edit") {
      const a = animeList.find(x => x.id === id);
      if (!a) return;
      modalTitle.textContent = "编辑番剧";
      editId.value = a.id;
      titleInput.value = a.title || "";
      yearInput.value = a.year || "";
      episodesInput.value = a.episodes || "";
      statusSelect.value = a.status || "在看";
      tagsInput.value = (a.tags || []).join(", ");
      noteInput.value = a.note || "";
    } else {
      modalTitle.textContent = "添加番剧";
    }
    modalOverlay.classList.add("open");
    titleInput.focus();
  }

  function closeModal() {
    modalOverlay.classList.remove("open");
    form.reset();
    editId.value = "";
  }

  // ---------- 事件 ----------
  document.getElementById("addBtn").addEventListener("click", () => openModal("add"));
  document.getElementById("cancelBtn").addEventListener("click", closeModal);

  modalOverlay.addEventListener("click", e => {
    if (e.target === modalOverlay) closeModal();
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && modalOverlay.classList.contains("open")) closeModal();
  });

  form.addEventListener("submit", e => {
    e.preventDefault();
    const title = titleInput.value.trim();
    if (!title) return;

    const data = {
      title,
      year: yearInput.value ? Number(yearInput.value) : null,
      episodes: episodesInput.value ? Number(episodesInput.value) : null,
      status: statusSelect.value,
      tags: tagsInput.value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
      note: noteInput.value.trim(),
    };

    if (editId.value) {
      const idx = animeList.findIndex(a => a.id === editId.value);
      if (idx !== -1) {
        animeList[idx] = { ...animeList[idx], ...data };
      }
    } else {
      animeList.unshift({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        ...data,
        createdAt: Date.now(),
      });
    }

    save(animeList);
    closeModal();
    render();
  });

  grid.addEventListener("click", e => {
    const editBtn = e.target.closest(".edit-btn");
    const deleteBtn = e.target.closest(".delete-btn");

    if (editBtn) {
      openModal("edit", editBtn.dataset.id);
      return;
    }

    if (deleteBtn) {
      const id = deleteBtn.dataset.id;
      const a = animeList.find(x => x.id === id);
      if (!a) return;
      if (confirm(`确定删除《${a.title}》吗？`)) {
        animeList = animeList.filter(x => x.id !== id);
        save(animeList);
        render();
      }
    }
  });

  searchInput.addEventListener("input", () => {
    keyword = searchInput.value;
    render();
  });

  // ---------- 启动 ----------
  render();
})();
</script>
</body>
</html>
